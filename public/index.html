<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<meta name="theme-color" id="theme-color-meta" content="#6aaad4" />
<title>BestWeather</title>
<meta name="apple-mobile-web-app-title" content="BestWeather"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="application-name" content="BestWeather"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link id="apple-touch-icon" rel="apple-touch-icon" sizes="180x180" />
<link id="favicon" rel="icon" type="image/png" sizes="32x32" />
<script>
(function(){
  const sz = 180, r = 40, half = sz / 2;
  const c = document.createElement('canvas');
  c.width = c.height = sz;
  const ctx = c.getContext('2d');

  // Rounded clip
  ctx.beginPath();
  ctx.moveTo(r,0); ctx.lineTo(sz-r,0); ctx.quadraticCurveTo(sz,0,sz,r);
  ctx.lineTo(sz,sz-r); ctx.quadraticCurveTo(sz,sz,sz-r,sz);
  ctx.lineTo(r,sz); ctx.quadraticCurveTo(0,sz,0,sz-r);
  ctx.lineTo(0,r); ctx.quadraticCurveTo(0,0,r,0);
  ctx.closePath(); ctx.clip();

  // Left half — deep sky blue gradient
  const gL = ctx.createLinearGradient(0, 0, 0, sz);
  gL.addColorStop(0, '#2fb8f0');
  gL.addColorStop(1, '#1460b0');
  ctx.fillStyle = gL;
  ctx.fillRect(0, 0, half, sz);

  // Right half — warm golden gradient
  const gR = ctx.createLinearGradient(0, 0, 0, sz);
  gR.addColorStop(0, '#ffd84a');
  gR.addColorStop(1, '#f08018');
  ctx.fillStyle = gR;
  ctx.fillRect(half, 0, half, sz);

  // Divider line
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.45)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(half, 0); ctx.lineTo(half, sz); ctx.stroke();
  ctx.restore();

  // Snowflake — clipped to left half
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, half, sz); ctx.clip();
  ctx.translate(half / 2, half);
  ctx.strokeStyle = 'rgba(255,255,255,0.96)';
  ctx.lineCap = 'round';
  const fs = 35;
  for (let i = 0; i < 6; i++) {
    ctx.save();
    ctx.rotate(i * Math.PI / 3);
    ctx.lineWidth = fs * 0.10;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -fs); ctx.stroke();
    ctx.lineWidth = fs * 0.08;
    [[0.38, 0.21], [0.68, 0.17]].forEach(([pos, wing]) => {
      const d = fs * pos, w = fs * wing;
      ctx.beginPath(); ctx.moveTo(0, -d); ctx.lineTo(-w, -d - w); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -d); ctx.lineTo( w, -d - w); ctx.stroke();
    });
    ctx.restore();
  }
  ctx.fillStyle = 'white';
  ctx.beginPath(); ctx.arc(0, 0, fs * 0.11, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // Sun — clipped to right half
  ctx.save();
  ctx.beginPath(); ctx.rect(half, 0, half, sz); ctx.clip();
  ctx.translate(half + half / 2, half);
  const sr = 21;
  ctx.strokeStyle = 'rgba(255,255,255,0.88)';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * (sr + 6), Math.sin(a) * (sr + 6));
    ctx.lineTo(Math.cos(a) * (sr + 16), Math.sin(a) * (sr + 16));
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.beginPath(); ctx.arc(0, 0, sr, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffc020';
  ctx.beginPath(); ctx.arc(0, 0, sr - 5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  const url = c.toDataURL('image/png');
  document.getElementById('apple-touch-icon').href = url;
  const f = document.createElement('canvas');
  f.width = f.height = 32;
  f.getContext('2d').drawImage(c, 0, 0, 32, 32);
  document.getElementById('favicon').href = f.toDataURL('image/png');
})();
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    background-color: #6aaad4;
    min-height: 100%;
    overscroll-behavior-y: none;
  }
  html.mode-sun {
    background-color: #2398d8;
  }

  :root {
    --ink: #0d1b2a; --ink2: #3a5068; --ink3: #7a9ab8;
    --blue: #1a5fa8; --blue-light: #d0e8f8; --blue-mid: #3b82c4;
    --red: #f04030; --red-light: #fde9e8; --red-mid: #f04030;
    --border: rgba(13,27,42,0.12); --radius: 16px;
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    min-height: 100dvh;
    transition: none;
    overscroll-behavior-y: none;
    overflow-x: hidden;
  }
  #bg {
    position: fixed;
    inset: 0;
    z-index: -1;
  }
  body.bg-snow #bg {
    background-image: url('/bg-snow.svg');
    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat;
  }
  body.bg-sun #bg {
    background-image:
      linear-gradient(180deg, rgba(255,244,204,0) 0%, rgba(255,244,204,0) 73.5%, rgba(242,222,160,0.96) 74%, rgba(200,168,92,1) 100%),
      linear-gradient(180deg, #2398d8 0%, #70c8ea 38%, #bde6f8 50.8%, #0f74b6 50.8%, #198fcd 63%, #39acd6 73%, #62c3dd 100%);
  }

  body.bg-sun::before {
    content: "";
    position: fixed;
    top: 22px;
    right: 22px;
    width: 132px;
    height: 132px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    background: radial-gradient(circle at 50% 50%, rgba(255,247,160,0.98) 0 26%, rgba(255,224,51,0.98) 27% 47%, rgba(255,224,51,0.28) 48% 67%, rgba(255,224,51,0) 68% 100%);
    box-shadow: 0 0 0 18px rgba(255,232,144,0.14);
  }
  body.bg-sun::after {
    content: "";
    position: fixed;
    left: 0;
    right: 0;
    top: 63vh;
    height: 19vh;
    pointer-events: none;
    z-index: 0;
    background: linear-gradient(180deg, rgba(18,129,191,0) 0%, rgba(18,129,191,0.14) 16%, rgba(32,149,201,0.46) 60%, rgba(88,192,222,0.88) 100%);
  }

  header {
    background: transparent;
    padding: 2.25rem 0 1.5rem;
  }

  .header-inner { max-width: 760px; margin: 0 auto; padding: 0 1.5rem; display: flex; flex-direction: column; align-items: flex-start; gap: 0.2rem; }

  .logo {
    display: inline-flex;
    align-items: baseline;
    gap: 0.18em;
    font-size: 2.22rem;
    font-weight: 450;
    letter-spacing: -0.05em;
    line-height: 0.96;
    margin-bottom: 0;
    color: white;
    text-shadow: 0 2px 12px rgba(0,0,0,0.18);
  }
  .logo span { color: white; font-weight: 650; }
  .tagline {
    max-width: 34ch;
    font-size: 1rem;
    line-height: 1.35;
    color: rgba(255,255,255,0.87);
    font-weight: 500;
    font-style: italic;
    margin-top: 0.45rem;
    display: block;
    text-shadow: 0 1px 6px rgba(0,0,0,0.15);
  }

  .app-wrap { max-width: 760px; margin: 2rem auto; padding: 0 1.5rem 3rem; }


  .app-card {
    background: linear-gradient(160deg, rgba(255,255,255,0.90) 0%, rgba(255,255,255,0.70) 100%);
    backdrop-filter: blur(20px) saturate(1.5);
    -webkit-backdrop-filter: blur(20px) saturate(1.5);
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.75);
    border-top-color: rgba(255,255,255,0.95);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.5) inset,
      0 2px 4px rgba(0,0,0,0.04),
      0 8px 28px rgba(0,0,0,0.10),
      0 32px 80px rgba(0,0,0,0.10);
    padding: 1.75rem;
  }

  .search-block { display: flex; gap: 10px; margin-bottom: 1.2rem; }

  button.loc-btn {
    -webkit-appearance: none; appearance: none;
    width: 46px; height: auto; flex-shrink: 0;
    border: 1.5px solid rgba(255,255,255,0.75);
    border-radius: 13px;
    background: rgba(255,255,255,0.82);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    box-shadow: 0 1px 0 rgba(255,255,255,0.95) inset, 0 2px 8px rgba(0,0,0,0.06);
    color: var(--ink2);
    -webkit-tap-highlight-color: transparent;
  }
  button.loc-btn:hover { background: rgba(255,255,255,0.92); transform: translateY(-1px); box-shadow: 0 1px 0 rgba(255,255,255,0.95) inset, 0 4px 14px rgba(0,0,0,0.1); color: var(--blue); }
  button.loc-btn:active { transform: translateY(0); }
  button.loc-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

  input[type="text"] {
    flex: 1; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 16px;
    padding: 0.85rem 1.1rem; border: 1.5px solid rgba(255,255,255,0.75);
    border-radius: 13px; background: rgba(255,255,255,0.90); color: var(--ink);
    outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    box-shadow: 0 1px 0 rgba(255,255,255,0.95) inset, 0 2px 8px rgba(0,0,0,0.06);
  }
  input[type="text"]:focus { border-color: rgba(26,95,168,0.45); box-shadow: 0 1px 0 rgba(255,255,255,0.95) inset, 0 0 0 3px rgba(26,95,168,0.13), 0 2px 8px rgba(0,0,0,0.06); }
  input[type="text"]::placeholder { color: var(--ink3); }

  button.search-btn {
    -webkit-appearance: none; appearance: none;
    font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.95rem; font-weight: 600;
    padding: 0.85rem 1.6rem;
    background: linear-gradient(170deg, #62c482 0%, #3d8f58 100%);
    color: white;
    border: none; border-radius: 13px; cursor: pointer;
    transition: opacity 0.15s, transform 0.15s, box-shadow 0.15s;
    white-space: nowrap; min-width: 84px; width: 84px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
    position: relative; overflow: hidden;
    box-shadow: 0 1px 0 rgba(255,255,255,0.22) inset, 0 2px 8px rgba(61,143,88,0.38), 0 4px 18px rgba(61,143,88,0.22);
  }
  button.search-btn::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 48%;
    background: linear-gradient(180deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 100%);
    border-radius: 13px 13px 0 0; pointer-events: none;
  }
  button.search-btn:hover { opacity: 0.92; transform: translateY(-1px); box-shadow: 0 1px 0 rgba(255,255,255,0.22) inset, 0 4px 16px rgba(61,143,88,0.45), 0 6px 24px rgba(61,143,88,0.25); }
  button.search-btn:active { opacity: 0.85; transform: translateY(0); box-shadow: 0 1px 4px rgba(61,143,88,0.3); }
  button.search-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

  .controls-row {
    display: flex; align-items: center;
    justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }

  .modes {
    display: flex; gap: 3px;
    background: rgba(255,255,255,0.32);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 999px; padding: 3px;
    border: 1px solid rgba(255,255,255,0.6);
    box-shadow: 0 1px 4px rgba(0,0,0,0.08) inset;
  }

  .mode-btn {
    font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.83rem; font-weight: 500;
    padding: 7px 18px; border-radius: 999px; border: none;
    background: transparent; color: rgba(13,27,42,0.55); cursor: pointer; transition: all 0.2s;
  }
  .mode-btn:hover { color: var(--ink); }
  .mode-btn.active { background: white; color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,0.14), 0 2px 10px rgba(0,0,0,0.08); }
  .mode-btn.active[data-mode="snow"] { color: var(--blue); }
  .mode-btn.active[data-mode="sun"]  { color: #b07800; }

  .checkbox-label {
    display: flex; align-items: center; gap: 8px; font-size: 0.83rem;
    color: var(--ink2); cursor: pointer; user-select: none; white-space: nowrap;
  }
  .checkbox-label input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--blue); cursor: pointer; }

  #result { display: none; margin-top: 1.6rem; animation: fadeUp 0.35s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .location-title { font-size: 1.4rem; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 0.15rem; }
  .location-sub { font-size: 0.79rem; color: var(--ink3); font-weight: 300; margin-bottom: 1.4rem; }

  .verdict {
    border-radius: var(--radius); padding: 1.2rem 1.4rem;
    margin-bottom: 1rem; border: 1.5px solid transparent;
    position: relative;
  }
  .verdict[data-mode="snow"] { background: linear-gradient(160deg, rgba(222,240,252,0.92) 0%, rgba(185,218,242,0.55) 100%); border-color: rgba(59,130,196,0.32); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 1px 0 rgba(255,255,255,0.75) inset, 0 2px 14px rgba(26,95,168,0.08); }
  .verdict[data-mode="sun"]  { background: linear-gradient(160deg, rgba(255,249,218,0.95) 0%, rgba(255,235,140,0.55) 100%); border-color: rgba(232,192,0,0.38); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 1px 0 rgba(255,255,255,0.75) inset, 0 2px 14px rgba(232,168,0,0.08); }

  .verdict-eyebrow {
    font-size: 0.68rem; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; margin-bottom: 0.3rem;
  }
  .verdict[data-mode="snow"] .verdict-eyebrow { color: var(--blue); }
  .verdict[data-mode="sun"]  .verdict-eyebrow { color: #b07800; }

  .verdict-headline { font-size: 1.12rem; font-weight: 500; color: var(--ink); line-height: 1.35; margin-bottom: 0.3rem; }
  .verdict-detail { font-size: 0.77rem; color: var(--ink2); font-weight: 300; }

  .other-stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
    gap: 6px; margin-top: 1.1rem; padding-top: 1.1rem;
    border-top: 1px solid rgba(13,27,42,0.07);
  }
  .stat-item { text-align: center; }
  .stat-val { font-size: 1.05rem; font-weight: 300; color: var(--ink); }
  .stat-lbl { font-size: 0.68rem; color: var(--ink3); margin-top: 1px; }

  .sources-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px;
  }

  .source-card {
    background: linear-gradient(160deg, rgba(255,255,255,0.88) 0%, rgba(255,255,255,0.65) 100%);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.75);
    border-top-color: rgba(255,255,255,0.95);
    border-radius: 16px; padding: 0.9rem 1rem;
    box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 2px 8px rgba(0,0,0,0.05), 0 4px 16px rgba(0,0,0,0.04);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .source-card:hover { transform: translateY(-2px); box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 4px 20px rgba(0,0,0,0.12); }
  .source-card.winner { border-width: 1.5px; }
  .source-card.winner[data-mode="snow"] { border-color: rgba(26,95,168,0.38); background: linear-gradient(160deg, rgba(215,235,252,0.82) 0%, rgba(185,218,242,0.55) 100%); box-shadow: 0 1px 0 rgba(255,255,255,0.7) inset, 0 4px 20px rgba(26,95,168,0.18); }
  .source-card.winner[data-mode="sun"]  { border-color: rgba(232,168,0,0.42); background: linear-gradient(160deg, rgba(255,248,214,0.88) 0%, rgba(255,235,140,0.55) 100%); box-shadow: 0 1px 0 rgba(255,255,255,0.7) inset, 0 4px 20px rgba(232,168,0,0.18); }

  .source-name { font-size: 0.68rem; font-weight: 500; color: var(--ink3); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.05em; }
  .source-card.winner .source-name { color: var(--ink2); }
  .source-value { font-size: 1.55rem; font-weight: 300; color: var(--ink); line-height: 1; }
  .source-unit { font-size: 0.72rem; color: var(--ink3); margin-top: 2px; }

  .winner-badge {
    display: inline-block; font-size: 0.63rem; font-weight: 600;
    padding: 2px 8px; border-radius: 999px; margin-top: 6px;
  }
  .winner[data-mode="snow"] .winner-badge { background: var(--blue); color: white; }
  .winner[data-mode="sun"]  .winner-badge { background: #e8a800; color: white; }

  .verdict-tip {
    --accent: var(--ink);
    position: absolute;
    top: 14px;
    right: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: 260px;
    padding: 0.65rem 0.75rem;
    border-radius: 18px;
    background: rgba(255,255,255,0.82);
    border: 1px solid rgba(255,255,255,0.78);
    backdrop-filter: blur(18px) saturate(1.6);
    -webkit-backdrop-filter: blur(18px) saturate(1.6);
    box-shadow: 0 1px 0 rgba(255,255,255,0.65) inset, 0 10px 26px rgba(0,0,0,0.12);
    z-index: 10;
    pointer-events: none;
  }
  .verdict[data-mode="snow"] .verdict-tip { border-color: rgba(26,95,168,0.22); }
  .verdict[data-mode="sun"]  .verdict-tip { border-color: rgba(232,168,0,0.24); }

  .verdict-tip__icon {
    width: 30px;
    height: 30px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    flex: 0 0 auto;
    box-shadow: 0 1px 0 rgba(255,255,255,0.35) inset, 0 10px 22px rgba(0,0,0,0.14);
  }
  .verdict[data-mode="snow"] .verdict-tip__icon { background: linear-gradient(180deg, rgba(26,95,168,0.95) 0%, rgba(26,95,168,0.78) 100%); }
  .verdict[data-mode="sun"]  .verdict-tip__icon { background: linear-gradient(180deg, rgba(232,168,0,0.95) 0%, rgba(176,120,0,0.88) 100%); }
  .verdict-tip__icon svg { width: 16px; height: 16px; }

  .verdict-tip__kicker {
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: rgba(13,27,42,0.58);
    margin-bottom: 1px;
  }
  .verdict-tip__text {
    font-size: 0.82rem;
    font-weight: 600;
    line-height: 1.2;
    color: var(--ink);
  }
  .verdict-tip__accent { color: var(--accent); font-weight: 800; }

  .error-msg {
    background: var(--red-light); border: 1.5px solid var(--red-mid);
    border-radius: 12px; padding: 0.9rem 1.1rem; color: var(--red);
    font-size: 0.88rem; margin-top: 1rem; display: none;
  }

  .spinner {
    display: none; width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.4); border-top-color: white;
    border-radius: 50%; animation: spin 0.7s linear infinite; margin: auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 600px) {
    .verdict-tip { position: static; width: 100%; max-width: none; margin-top: 0.75rem; pointer-events: none; }
    header { padding: calc(0.95rem + env(safe-area-inset-top, 0px)) 0 0.85rem; background: transparent; }
    .header-inner { padding: 0 1rem; gap: 0.1rem; }
    .logo { font-size: clamp(1.72rem, 8vw, 1.95rem); letter-spacing: -0.05em; line-height: 0.96; color: white; max-width: none; gap: 0.16em; }
    .tagline { font-size: 0.82rem; line-height: 1.36; margin-top: 0.34rem; color: rgba(255,255,255,0.86); max-width: 27ch; font-style: italic; }
    .app-wrap { margin: 0.45rem auto 0; padding: 0 0.95rem calc(1.8rem + env(safe-area-inset-bottom, 0px)); }
    .app-card {
      padding: 1.12rem;
      border-radius: 20px;
      border-top-color: rgba(255,255,255,0.98);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.58) inset,
        0 8px 24px rgba(13,27,42,0.08),
        0 22px 52px rgba(13,27,42,0.14);
    }
    .search-block { gap: 8px; margin-bottom: 0.9rem; }
    .controls-row { gap: 8px; align-items: center; }
    input[type="text"] { font-size: 0.9rem; padding: 0.7rem 0.85rem; }
    button.loc-btn { width: 40px; border-radius: 11px; }
    button.search-btn { padding: 0.7rem 1.1rem; font-size: 0.88rem; min-width: 70px; }
    .mode-btn { font-size: 0.78rem; padding: 6px 13px; }
    .checkbox-label { font-size: 0.78rem; }
    #result { margin-top: 1rem; }
    .location-title { font-size: 1.1rem; }
    .location-sub { font-size: 0.72rem; margin-bottom: 0.9rem; }
    .verdict { padding: 0.9rem 1rem; margin-bottom: 0.75rem; }
    .verdict-headline { font-size: 0.95rem; }
    .verdict-detail { font-size: 0.72rem; }
    .other-stats { gap: 4px; margin-top: 0.8rem; padding-top: 0.8rem; grid-template-columns: repeat(5, 1fr); }
    .stat-val { font-size: 0.88rem; }
    .stat-lbl { font-size: 0.6rem; }
  }
  @media (max-width: 820px) and (pointer: coarse) {
    body.bg-sun::before {
      top: calc(10px + env(safe-area-inset-top, 0px));
      right: 10px;
      width: 104px;
      height: 104px;
      box-shadow: 0 0 0 14px rgba(255,232,144,0.12);
    }
    body.bg-sun::after {
      top: 63vh;
      height: 19vh;
    }
    body.bg-sun .wave-svg { left: -24px; width: calc(100% + 48px); }
    body.bg-sun .wave-svg.w1 { top: 52vh; }
    body.bg-sun .wave-svg.w2 { top: 56vh; }
    body.bg-sun .wave-svg.w3 { top: 60vh; }
    body.bg-sun .wave-svg.w4 { top: 63vh; }
    body.bg-sun .wave-svg.w5 { top: 66vh; }
  }


  .wave-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    display: none;
    overflow: hidden;
  }
  body.bg-sun .wave-overlay { display: block; }
  .wave-svg { position: fixed; left: -100px; width: calc(100% + 200px); }
  .wave-svg.w1 { top: 52vh; }
  .wave-svg.w2 { top: 56vh; }
  .wave-svg.w3 { top: 60vh; }
  .wave-svg.w4 { top: 63vh; }
  .wave-svg.w5 { top: 66vh; }
  .wl1 { animation: wbob1 4s ease-in-out infinite; }
  .wl2 { animation: wbob2 5.2s ease-in-out infinite; }
  .wl3 { animation: wbob3 3.8s ease-in-out infinite; }
  .wl4 { animation: wbob4 6s ease-in-out infinite; }
  .wl5 { animation: wbob5 4.6s ease-in-out infinite; }
  @keyframes wbob1 { 0%,100%{transform:translateY(0) translateX(0)} 50%{transform:translateY(-8px) translateX(18px)} }
  @keyframes wbob2 { 0%,100%{transform:translateY(0) translateX(0)} 50%{transform:translateY(6px) translateX(-22px)} }
  @keyframes wbob3 { 0%,100%{transform:translateY(0) translateX(0)} 50%{transform:translateY(-5px) translateX(14px)} }
  @keyframes wbob4 { 0%,100%{transform:translateY(0) translateX(0)} 50%{transform:translateY(7px) translateX(-16px)} }
  @keyframes wbob5 { 0%,100%{transform:translateY(0) translateX(0)} 50%{transform:translateY(-4px) translateX(10px)} }





  .snowflake {
    position: fixed;
    top: -10px;
    border-radius: 50%;
    background: white;
    opacity: 0;
    animation: snowfall linear infinite;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes snowfall {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    5%   { opacity: 1; }
    95%  { opacity: 0.6; }
    100% { transform: translateY(110vh) translateX(var(--drift, 40px)); opacity: 0; }
  }
  .app-card, header { position: relative; z-index: 1; }

</style>
</head>
<body class="bg-snow">
<div id="bg" aria-hidden="true"></div>

<header>
  <div class="header-inner">
    <div class="logo">Best <span>Weather</span></div>
    <div class="tagline">For people who prefer powder, sunshine, and selective trust!</div>
  </div>
</header>

<div class="app-wrap">
  <div class="app-card">
    <div class="search-block">
      <input type="text" id="place" placeholder="e.g. Bydalen, Åre..." autocomplete="off" />
      <button class="loc-btn" onclick="useMyLocation()" id="loc-btn" title="Use my location">
        <svg width="18" height="18" viewBox="0 0 24 24" stroke="none">
          <circle cx="12" cy="12" r="11" fill="#e02020"/>
          <circle cx="12" cy="12" r="8.5" fill="white"/>
          <circle cx="12" cy="12" r="6" fill="#e02020"/>
          <circle cx="12" cy="12" r="3.5" fill="white"/>
          <circle cx="12" cy="12" r="1.8" fill="#e02020"/>
        </svg>
      </button>
      <button class="search-btn" onclick="doSearch()" id="search-btn">
        <span id="btn-label">Search</span>
        <div class="spinner" id="spinner"></div>
      </button>
    </div>

    <div class="controls-row">
      <div class="modes">
        <button class="mode-btn active" data-mode="snow" onclick="setMode('snow', this)">Powder!</button>
        <button class="mode-btn" data-mode="sun" onclick="setMode('sun', this)">Sunshine!</button>
      </div>
      <label class="checkbox-label">
        <input type="checkbox" id="seven-days" />
        7 days ahead
      </label>
    </div>

    <div class="error-msg" id="error"></div>
    <div id="result"></div>
  </div>
</div>

<script>
let currentMode = 'snow';
let dataCache = {};

// XSS helper — escapes untrusted strings before inserting into HTML
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

const modeConfig = {
  snow: { key: 'snow', unit: 'cm', label: 'snowfall', eyebrow: 'Best snow forecast', detail: 'Source with most snowfall selected', headline: (s,v,d) => `${esc(s)} promises ${esc(v)} cm of fresh snow ${d===1?'today':'over the coming week'}` },
  sun:  { key: 'sun',  unit: 'h',  label: 'sun hours', eyebrow: 'Most sunshine across sources', detail: 'Source with most sunshine hours selected', headline: (s,v,d) => `${esc(s)} forecasts ${esc(v)} hours of sunshine ${d===1?'today':'over the next 7 days'}` },
};

function getDays() { return document.getElementById('seven-days').checked ? 7 : 1; }

const placeholders = {
  snow: 'e.g. Bydalen, Åre...',
  sun:  'e.g. Tucepi, Marbella...'
};

function setMode(mode, btn) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.body.className = mode === 'snow' ? 'bg-snow' : 'bg-sun';
  document.documentElement.className = mode === 'sun' ? 'mode-sun' : '';
  document.getElementById('theme-color-meta').setAttribute('content', mode === 'snow' ? '#6aaad4' : '#2398d8');
  document.getElementById('place').placeholder = placeholders[mode];
  if (mode !== 'snow') {
    document.querySelectorAll('.snowflake').forEach(f => f.remove());
  }
  if (dataCache[mode]) {
    renderResult(dataCache[mode], getDays());
  } else if (Object.keys(dataCache).length > 0) {
    doSearch(true);
  }
}

async function doSearch(preserveCache = false) {
  const place = document.getElementById('place').value.trim();
  if (!place) return;
  if (!preserveCache) dataCache = {};
  const resultEl = document.getElementById('result');
  resultEl.style.display = 'none';
  resultEl.innerHTML = '';
  setLoading(true);
  hideError();
  try {
    const days = getDays();
    const ts = Date.now();
    const res = await fetch(`/api/weather?place=${encodeURIComponent(place)}&mode=${currentMode}&days=${days}&t=${ts}`, { cache: 'no-store' });
    const data = await res.json();
    if (data.error) { showError(data.error); return; }
    dataCache[currentMode] = data;
    renderResult(data, days);
  } catch {
    showError('Something went wrong. Please check your connection and try again.');
  } finally {
    setLoading(false);
  }
}

function buildTipHtml(winner, days) {
  if (days !== 1) return '';
  if (currentMode === 'sun') {
    const uv = winner.uv ?? null;
    if (uv === null) return '';
    let spfText;
    if (uv <= 2)       spfText = 'SPF 15';
    else if (uv <= 5)  spfText = 'SPF 30';
    else if (uv <= 7)  spfText = 'SPF 30–50';
    else if (uv <= 10) spfText = 'SPF 50';
    else               spfText = 'SPF 50+';
    const color = uv <= 2 ? '#3aaa55' : uv <= 5 ? '#e8a800' : uv <= 7 ? '#e06000' : uv <= 10 ? '#d02000' : '#9b00c8';
    return `<div class="verdict-tip" role="note" aria-label="Sunscreen tip: ${esc(spfText)}" style="--accent:${color}">
      <div class="verdict-tip__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></div>
      <div><div class="verdict-tip__kicker">Sunscreen</div><div class="verdict-tip__text">Recommended: <span class="verdict-tip__accent">${esc(spfText)}</span></div></div>
    </div>`;
  } else {
    const temp = winner.maxTemp;
    const waxName = temp <= -4 ? 'purple' : temp <= 4 ? 'red' : 'yellow';
    const color   = temp <= -4 ? '#7b35c1' : temp <= 4 ? '#e02020' : '#c89000';
    return `<div class="verdict-tip" role="note" aria-label="Wax tip: ${esc(waxName)}" style="--accent:${color}">
      <div class="verdict-tip__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10 20-1.25-2.5L6 18"/><path d="M10 4 8.75 6.5 6 6"/><path d="m14 20 1.25-2.5L18 18"/><path d="m14 4 1.25 2.5L18 6"/><path d="m17 21-3-6h-4"/><path d="m17 3-3 6 1.5 3"/><path d="M2 12h6.5L10 9"/><path d="m20 10-1.5 2 1.5 2"/><path d="M22 12h-6.5L14 15"/><path d="m4 10 1.5 2L4 14"/><path d="m7 21 3-6-1.5-3"/><path d="m7 3 3 6h4"/></svg></div>
      <div><div class="verdict-tip__kicker">Ski wax</div><div class="verdict-tip__text">Use <span class="verdict-tip__accent">${esc(waxName)}</span> wax</div></div>
    </div>`;
  }
}

function renderResult(data, days) {
  if (days === undefined) days = data.days || 1;
  const m = modeConfig[currentMode];
  const winner = data.winner;
  const el = document.getElementById('result');
  const sourcesCount = data.sourcesCount || 1;

  el.innerHTML = `
    <div class="location-title">${esc(data.location.name)}, ${esc(data.location.country)}</div>
    <div class="location-sub">${days === 1 ? "Today's forecast" : '7-day forecast'} · ${esc(sourcesCount)} sources compared</div>
    <div class="verdict" data-mode="${esc(currentMode)}">
      <div class="verdict-eyebrow">${m.eyebrow}</div>
      <div class="verdict-headline">${m.headline(winner.source, winner[m.key], days)}</div>
      <div class="verdict-detail">${m.detail}</div>
      <div class="other-stats">
        <div class="stat-item"><div class="stat-val">${esc(winner.maxTemp)}°C</div><div class="stat-lbl">Max temp</div></div>
        ${currentMode === 'sun'
          ? `<div class="stat-item"><div class="stat-val">${esc(winner.uv ?? '–')}</div><div class="stat-lbl">UV index</div></div>`
          : `<div class="stat-item"><div class="stat-val">${esc(winner.snow)} cm</div><div class="stat-lbl">Snow</div></div>`}
        <div class="stat-item"><div class="stat-val">${esc(winner.sun)} h</div><div class="stat-lbl">Sun</div></div>
        <div class="stat-item"><div class="stat-val">${esc(winner.wind)} m/s</div><div class="stat-lbl">Max wind</div></div>
        <div class="stat-item"><div class="stat-val">${esc(winner.rain)} mm</div><div class="stat-lbl">Rain</div></div>
      </div>
      ${buildTipHtml(winner, days)}
    </div>
  `;

  el.style.display = 'block';
}

function setLoading(on) {
  document.getElementById('search-btn').disabled = on;
  document.getElementById('btn-label').style.display = on ? 'none' : 'inline';
  document.getElementById('spinner').style.display = on ? 'block' : 'none';
}
function showError(msg) { const e = document.getElementById('error'); e.textContent = msg; e.style.display = 'block'; }
function hideError() { document.getElementById('error').style.display = 'none'; }
document.getElementById('place').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

async function useMyLocation() {
  if (!navigator.geolocation) { showError('Din webbläsare stöder inte geolokalisering.'); return; }
  const btn = document.getElementById('loc-btn');
  btn.disabled = true;
  navigator.geolocation.getCurrentPosition(async (pos) => {
    try {
      const { latitude: lat, longitude: lon } = pos.coords;
      const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=sv`);
      const data = await res.json();
      const city = data.city || data.locality || data.principalSubdivision;
      if (!city) throw new Error('Kunde inte identifiera orten för din position.');
      document.getElementById('place').value = city;
      doSearch();
    } catch {
      showError('Kunde inte hämta din position. Försök söka manuellt.');
    } finally {
      btn.disabled = false;
    }
  }, () => {
    showError('Platsåtkomst nekad. Tillåt platsdelning i webbläsarens inställningar.');
    btn.disabled = false;
  }, { timeout: 8000 });
}
document.getElementById('seven-days').addEventListener('change', () => {
  const place = document.getElementById('place').value.trim();
  if (place) {
    document.querySelectorAll('.verdict-tip').forEach(s => s.remove());
    doSearch();
  }
});

function createSnow() {
  if (!document.body.classList.contains('bg-snow')) return;
  const flake = document.createElement('div');
  flake.className = 'snowflake';
  const size = Math.random() * 5 + 2;
  const duration = Math.random() * 6 + 5;
  const delay = Math.random() * 4;
  const left = Math.random() * 100;
  const drift = (Math.random() - 0.5) * 120;
  flake.style.cssText = `width:${size}px;height:${size}px;left:${left}vw;animation-duration:${duration}s;animation-delay:${delay}s;`;
  flake.style.setProperty('--drift', drift + 'px');
  document.body.appendChild(flake);
  setTimeout(() => flake.remove(), (duration + delay) * 1000);
}
let snowInterval = setInterval(createSnow, 180);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    clearInterval(snowInterval);
  } else {
    snowInterval = setInterval(createSnow, 180);
  }
});

</script>

<div class="wave-overlay">
  <svg class="wave-svg w1" viewBox="0 0 1600 20" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" height="20">
    <path class="wl1" d="M0,10 Q200,2 400,10 Q600,18 800,10 Q1000,2 1200,10 Q1400,18 1600,10" stroke="white" stroke-width="2.5" fill="none" opacity="0.55"/>
  </svg>
  <svg class="wave-svg w2" viewBox="0 0 1600 20" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" height="20">
    <path class="wl2" d="M0,10 Q220,2 440,10 Q660,18 880,10 Q1100,2 1320,10 Q1500,18 1600,10" stroke="white" stroke-width="2" fill="none" opacity="0.42"/>
  </svg>
  <svg class="wave-svg w3" viewBox="0 0 1600 20" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" height="20">
    <path class="wl3" d="M0,10 Q180,3 360,10 Q540,17 720,10 Q900,3 1080,10 Q1260,17 1440,10 Q1540,15 1600,10" stroke="white" stroke-width="1.8" fill="none" opacity="0.35"/>
  </svg>
  <svg class="wave-svg w4" viewBox="0 0 1600 20" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" height="20">
    <path class="wl4" d="M0,10 Q240,3 480,10 Q720,17 960,10 Q1200,3 1440,10 Q1550,15 1600,10" stroke="white" stroke-width="1.5" fill="none" opacity="0.3"/>
  </svg>
  <svg class="wave-svg w5" viewBox="0 0 1600 20" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" height="20">
    <path class="wl5" d="M0,10 Q200,4 400,10 Q600,16 800,10 Q1000,4 1200,10 Q1400,16 1600,10" stroke="white" stroke-width="1" fill="none" opacity="0.22"/>
  </svg>
</div>
</body>
</html>
