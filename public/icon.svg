      </g>
      <circle cx="0" cy="0" r="3.85" fill="rgba(255,255,255,0.96)" stroke="none"/>
    </g>
    <!-- Sun at (135,90), sr=21, rays from r=27 to r=37 -->
    <g transform="translate(135,90)">
      <g stroke="rgba(255,255,255,0.88)" stroke-width="3" stroke-linecap="round">
        <line x1="0" y1="-27" x2="0" y2="-37"/>
        <line x1="19.09" y1="-19.09" x2="26.16" y2="-26.16"/>
        <line x1="27" y1="0" x2="37" y2="0"/>
        <line x1="19.09" y1="19.09" x2="26.16" y2="26.16"/>
        <line x1="0" y1="27" x2="0" y2="37"/>
        <line x1="-19.09" y1="19.09" x2="-26.16" y2="26.16"/>
        <line x1="-27" y1="0" x2="-37" y2="0"/>
        <line x1="-19.09" y1="-19.09" x2="-26.16" y2="-26.16"/>
      </g>
      <circle cx="0" cy="0" r="21" fill="rgba(255,255,255,0.95)"/>
