        <line x1="0" y1="0" x2="0" y2="-35" stroke-width="3.5"/>
        <line x1="0" y1="-13.3" x2="-7.35" y2="-20.65" stroke-width="2.8"/>
        <line x1="0" y1="-13.3" x2="7.35" y2="-20.65" stroke-width="2.8"/>
        <line x1="0" y1="-23.8" x2="-5.95" y2="-29.75" stroke-width="2.8"/>
        <line x1="0" y1="-23.8" x2="5.95" y2="-29.75" stroke-width="2.8"/>
      </g>
      <g transform="rotate(60)">
