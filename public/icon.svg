<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <clipPath id="rr">
      <rect width="180" height="180" rx="40" ry="40"/>
    </clipPath>
    <linearGradient id="gl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fb8f0"/>
      <stop offset="1" stop-color="#1460b0"/>
    </linearGradient>
    <linearGradient id="gr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd84a"/>
      <stop offset="1" stop-color="#f08018"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#rr)">
    <rect x="0" y="0" width="90" height="180" fill="url(#gl)"/>
    <rect x="90" y="0" width="90" height="180" fill="url(#gr)"/>
    <line x1="90" y1="0" x2="90" y2="180" stroke="rgba(255,255,255,0.45)" stroke-width="2"/>
    <!-- Snowflake at (45,90) -->
    <g transform="translate(45,90)" stroke="rgba(255,255,255,0.96)" stroke-linecap="round" fill="none">
